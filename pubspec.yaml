name: still
description: >-
  Cross-fades instead of slides when the platform asks for Reduce Motion.
  Style-neutral, so custom design systems keep working as Material leaves the SDK.
version: 0.1.6
repository: https://github.com/pedrinnhooo/still-pubdev
topics:
  - accessibility
  - animation
screenshots:
  - description: Motion that knows when to stop.
    path: doc/banner.jpg

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
